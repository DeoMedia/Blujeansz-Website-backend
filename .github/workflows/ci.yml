name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API imports and routes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the app builds its route table
        # Railway deploys on push, so a broken import should fail here first.
        # Placeholder config is enough: nothing below connects to a database.
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
        run: |
          python - <<'PY'
          from app.main import app
          paths = app.openapi()["paths"]
          count = sum(len(v) for v in paths.values())
          print(f"{count} endpoints across {len(paths)} paths")
          assert count > 30, f"expected the full route table, found {count}"
          PY

      - name: Check auth refuses unauthenticated requests
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
        run: |
          python - <<'PY'
          import anyio, httpx
          from app.main import app

          async def main():
              transport = httpx.ASGITransport(app=app)
              async with httpx.AsyncClient(transport=transport, base_url="http://test") as c:
                  for method, path in [
                      ("GET", "/api/me"),
                      ("POST", "/api/insights"),
                      ("GET", "/api/insights/admin/all"),
                  ]:
                      r = await c.request(method, path, json={} if method == "POST" else None)
                      assert r.status_code == 401, f"{method} {path} returned {r.status_code}, expected 401"

                  r = await c.get("/api/me", headers={"Authorization": "Bearer forged.token.here"})
                  assert r.status_code == 401, f"forged token returned {r.status_code}"

                  r = await c.get("/health")
                  assert r.status_code == 200

              print("auth checks passed")

          anyio.run(main)
          PY

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: blujeansz
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Apply stubs and migrations
        # The migrations reference Supabase's managed auth and storage schemas,
        # which do not exist on a plain Postgres. The stubs recreate just enough
        # of both to prove the SQL is valid and self-consistent before it is run
        # against the real project.
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d blujeansz -v ON_ERROR_STOP=1 \
            -f supabase/tests/00_supabase_stubs.sql

          for file in supabase/migrations/*.sql; do
            echo "--- $file"
            psql -h localhost -U postgres -d blujeansz -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Report what was created
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d blujeansz -c \
            "select count(*) as tables from information_schema.tables where table_schema='public';"
          psql -h localhost -U postgres -d blujeansz -c \
            "select count(*) as policies from pg_policies where schemaname='public';"
          psql -h localhost -U postgres -d blujeansz -c \
            "select status, count(*) from public.insights group by status order by status;"
